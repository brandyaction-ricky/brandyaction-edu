<h2>브랜디에듀 새 로그인 이메일 확인</h2>
<p>브랜디에듀 로그인 이메일을 <strong>{{ .NewEmail }}</strong> 주소로 바꾸려면 아래 버튼을 눌러 주세요.</p>
<p><a href="{{ .SiteURL }}/auth/confirm?flow=email_change&amp;token_hash={{ .TokenHash }}&amp;type=email_change">새 이메일 확인하기</a></p>
<p>이 버튼을 한 번 누르면 이메일 변경이 끝납니다. 이후 새 이메일과 변경 신청 때 정한 브랜디에듀 비밀번호로 로그인할 수 있습니다. 기존 주문과 수강 내역은 그대로 유지됩니다.</p>
<p>본인이 요청하지 않았다면 버튼을 누르지 말고 이 메일을 무시해 주세요.</p>
