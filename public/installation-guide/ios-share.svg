<svg xmlns="http://www.w3.org/2000/svg" width="600" height="420" viewBox="0 0 600 420"><title>사파리에서 공유 버튼 찾기</title><rect width="600" height="420" rx="18" fill="#f5f6f8"/><g font-family="-apple-system,BlinkMacSystemFont,Apple SD Gothic Neo,Noto Sans KR,sans-serif"><text x="28" y="38" font-size="20" fill="#626c7b" font-weight="500">설명용 그림 · 실제 화면과 다를 수 있어요</text><text x="28" y="84" font-size="30" fill="#202733" font-weight="700">사파리에서 공유 버튼 찾기</text><rect x="28" y="112" width="544" height="266" rx="14" fill="#fff" stroke="#d8dde5" stroke-width="2"/><rect x="50" y="134" width="500" height="48" rx="14" fill="#f5f6f8" stroke="#d8dde5" stroke-width="2"/><text x="69" y="166" font-size="24" fill="#202733" font-weight="500">브랜디에듀를 사파리로 열어요</text><rect x="50" y="196" width="342" height="60" rx="14" fill="#fff" stroke="#d8dde5" stroke-width="2"/><text x="68" y="234" font-size="27" fill="#202733" font-weight="700">공유 버튼을 눌러요</text><rect x="412" y="159" width="72" height="98" rx="14" fill="#fff3f4" stroke="#bb1e2f" stroke-width="2"/><path d="M447 216v-37m-12 12 12-12 12 12m-28 20v27h32v-27" fill="none" stroke="#bb1e2f" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="58" y="301" font-size="25" fill="#202733" font-weight="500">안 보이면 메뉴(…)를 먼저 눌러요</text><text x="58" y="343" font-size="22" fill="#626c7b" font-weight="500">공유: 네모 위로 화살표가 올라가는 모양</text></g></svg>