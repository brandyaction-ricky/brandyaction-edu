<svg xmlns="http://www.w3.org/2000/svg" width="600" height="420" viewBox="0 0 600 420"><title>홈 화면에 추가 → 추가</title><rect width="600" height="420" rx="18" fill="#f5f6f8"/><g font-family="-apple-system,BlinkMacSystemFont,Apple SD Gothic Neo,Noto Sans KR,sans-serif"><text x="28" y="38" font-size="20" fill="#626c7b" font-weight="500">설명용 그림 · 실제 화면과 다를 수 있어요</text><text x="28" y="84" font-size="30" fill="#202733" font-weight="700">홈 화면에 추가 → 추가</text><rect x="28" y="112" width="544" height="266" rx="14" fill="#fff" stroke="#d8dde5" stroke-width="2"/><rect x="50" y="134" width="500" height="60" rx="14" fill="#fff3f4" stroke="#bb1e2f" stroke-width="2"/><text x="73" y="174" font-size="28" fill="#bb1e2f" font-weight="700">⊞  홈 화면에 추가</text><text x="62" y="230" font-size="25" fill="#202733" font-weight="500">목록에서 찾은 다음 눌러 주세요</text><rect x="50" y="250" width="500" height="102" rx="14" fill="#f5f6f8" stroke="#d8dde5" stroke-width="2"/><text x="72" y="285" font-size="22" fill="#202733" font-weight="500">웹 앱으로 열기가 보이면 켜 두세요</text><rect x="390" y="302" width="134" height="40" rx="10" fill="#bb1e2f" stroke="#bb1e2f" stroke-width="2"/><text x="432" y="331" font-size="25" fill="#fff" font-weight="700">추가</text><text x="72" y="331" font-size="22" fill="#202733" font-weight="500">마지막으로 ‘추가’를 눌러요</text></g></svg>