<svg xmlns="http://www.w3.org/2000/svg" width="600" height="420" viewBox="0 0 600 420"><title>크롬에서 점 3개 → 설치 메뉴</title><rect width="600" height="420" rx="18" fill="#f5f6f8"/><g font-family="-apple-system,BlinkMacSystemFont,Apple SD Gothic Neo,Noto Sans KR,sans-serif"><text x="28" y="38" font-size="20" fill="#626c7b" font-weight="500">설명용 그림 · 실제 화면과 다를 수 있어요</text><text x="28" y="84" font-size="30" fill="#202733" font-weight="700">크롬에서 점 3개 → 설치 메뉴</text><rect x="28" y="112" width="544" height="266" rx="14" fill="#fff" stroke="#d8dde5" stroke-width="2"/><rect x="50" y="132" width="500" height="54" rx="14" fill="#f5f6f8" stroke="#d8dde5" stroke-width="2"/><text x="69" y="167" font-size="25" fill="#202733" font-weight="500">브랜디에듀</text><rect x="484" y="131" width="56" height="54" rx="14" fill="#fff3f4" stroke="#bb1e2f" stroke-width="2"/><text x="500" y="170" font-size="35" fill="#bb1e2f" font-weight="700">⋮</text><rect x="50" y="210" width="500" height="60" rx="14" fill="#fff3f4" stroke="#bb1e2f" stroke-width="2"/><text x="70" y="249" font-size="25" fill="#bb1e2f" font-weight="700">설치 및 바로가기 만들기 → 설치</text><text x="60" y="308" font-size="24" fill="#202733" font-weight="500">‘홈 화면에 추가’ 또는 ‘앱 설치’로</text><text x="60" y="344" font-size="24" fill="#626c7b" font-weight="500">표시될 수도 있어요</text></g></svg>