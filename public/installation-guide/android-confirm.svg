<svg xmlns="http://www.w3.org/2000/svg" width="600" height="420" viewBox="0 0 600 420"><title>설치 창에서 설치 또는 추가</title><rect width="600" height="420" rx="18" fill="#f5f6f8"/><g font-family="-apple-system,BlinkMacSystemFont,Apple SD Gothic Neo,Noto Sans KR,sans-serif"><text x="28" y="38" font-size="20" fill="#626c7b" font-weight="500">설명용 그림 · 실제 화면과 다를 수 있어요</text><text x="28" y="84" font-size="30" fill="#202733" font-weight="700">설치 창에서 설치 또는 추가</text><rect x="28" y="112" width="544" height="266" rx="14" fill="#fff" stroke="#d8dde5" stroke-width="2"/><rect x="50" y="134" width="500" height="218" rx="14" fill="#fff" stroke="#d8dde5" stroke-width="2"/><text x="72" y="180" font-size="31" fill="#202733" font-weight="700">브랜디에듀</text><text x="72" y="227" font-size="25" fill="#202733" font-weight="500">이름을 확인하고 아래 버튼을 눌러요</text><rect x="316" y="260" width="210" height="64" rx="14" fill="#fff3f4" stroke="#bb1e2f" stroke-width="2"/><text x="355" y="302" font-size="28" fill="#bb1e2f" font-weight="700">설치 / 추가</text><text x="72" y="309" font-size="25" fill="#626c7b" font-weight="500">취소</text></g></svg>