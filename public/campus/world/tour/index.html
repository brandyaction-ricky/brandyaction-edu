<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>문샷 네 공간 미리보기</title><link rel="stylesheet" href="../office/world.css"><link rel="stylesheet" href="./tour.css"></head><body><main class="workspace"><div id="office" tabindex="0" aria-label="문샷 공간 · WASD·방향키·바닥 클릭 이동"></div><nav id="hotspots" aria-label="이 공간에서 할 일"></nav><p id="status" role="status">공간과 캐릭터를 준비하고 있어요.</p><div class="tour-pad" aria-label="캐릭터 이동"><button data-direction="up" aria-label="위로 이동">↑</button><div><button data-direction="left" aria-label="왼쪽 이동">←</button><button data-direction="down" aria-label="아래로 이동">↓</button><button data-direction="right" aria-label="오른쪽 이동">→</button></div></div></main><dialog id="appearance-editor" aria-labelledby="appearance-title">
 <form><header><p>나의 문샷 동료</p><h2 id="appearance-title">캐릭터 꾸미기</h2></header>
 <div class="character-layout"><div class="avatar-preview-card"><div id="avatar-preview"></div><p id="avatar-name"></p><small>공간 속 캐릭터와 같은 모습입니다.</small></div>
 <div class="character-fields"><label>닉네임<input name="nickname" maxlength="24" required autocomplete="off"></label><p class="hint">캐릭터 머리 위에 표시됩니다.</p>
 <div class="profile-fields"><label>캐릭터 유형<select name="gender" aria-label="캐릭터 유형"><option value="male">남성형</option><option value="female">여성형</option></select></label><label>외형 스타일<select name="model" aria-label="외형 스타일"><option value="0">스타일 1</option><option value="1">스타일 2</option><option value="2">스타일 3</option><option value="3">스타일 4</option><option value="4">스타일 5</option><option value="5">스타일 6</option></select></label></div><p class="hint">남성형·여성형, 총 12가지 외형을 고를 수 있어요.</p>
 <div class="character-colors"><label>머리<input type="color" name="hairColor"></label><label>피부<input type="color" name="skinColor"></label><label>의상<input type="color" name="coat"></label><label>바지<input type="color" name="pantsColor"></label></div>
 <label>손에 들 소품<select name="heldItem" aria-label="손에 들 소품"><option value="none">없음</option><option value="coffee">커피 한 잔</option><option value="book">읽고 있는 책</option></select></label>
 </div></div><p id="appearance-error" role="status" aria-live="polite"></p><footer><button id="appearance-cancel" type="button">취소</button><button id="appearance-save" type="button">저장하기</button></footer></form>
</dialog><script type="module" src="./tour.mjs"></script></body></html>
