<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>문샷 웰컴존 · AI 직원의 사무실</title>
  <link rel="stylesheet" href="./welcome-walk.css">
  <link rel="modulepreload" href="../office/vendor/office.js">
  <link rel="modulepreload" href="../office/vendor/office3d.js">
</head>
<body>
  <main id="walk" data-ready="false">
    <canvas id="floor" tabindex="0" aria-label="문샷 사무실 복도. 방향키나 WASD로 걷고, 목적지를 눌러 다가가세요."></canvas>
    <button id="destination" hidden>
      <span id="destination-label"></span>
      <span id="destination-greeting" hidden></span>
      <span class="pointer" aria-hidden="true"></span>
    </button>
    <button id="lobby-materials" class="lobby-guide" type="button" hidden>
      <strong>자료 안내</strong><span>강의 전에 써볼 자료를 준비했어요. 저를 눌러 확인해보세요.</span>
      <span class="pointer" aria-hidden="true"></span>
    </button>
    <button id="lobby-intro" class="lobby-guide" type="button" hidden>
      <strong>퇴사선배 윤익 · 브랜디액션</strong><span>퇴사선배 윤익과 브랜디액션 팀이 AI와 일하는 모습을 소개할게요.</span>
      <span class="pointer" aria-hidden="true"></span>
    </button>
  </main>
  <script type="module" src="./welcome-walk.mjs"></script>
</body>
</html>
