<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer"><title>문샷 통합 공간</title><link rel="stylesheet" href="./world.css"></head>
<body><main class="workspace"><div id="office" tabindex="0" aria-label="문샷 공간 · 방향키 또는 WASD 이동"></div>
<p id="status" role="status">문샷 공간을 준비하고 있어요.</p>
<div class="room-tools"><button id="guide-toggle" aria-expanded="false" aria-controls="space-guide">내 도구</button><div id="space-guide" hidden><strong>내 도구</strong><p>수업·집중·대화는 공간에서 바로 열어요.</p><div class="guide-grid"><button data-task="mission">수업·과제</button><button data-task="desk">집중하기</button><button data-task="board">결과물·피드백</button><button data-task="chat">동료와 대화</button><button data-task="ai">AI에게 질문</button><button data-task="business">내 사업 실행</button><button data-task="support">도움 요청·약속</button><button data-task="journal">내 실행 수첩</button></div><hr><div class="guide-grid"><button id="appearance-open" disabled>캐릭터 꾸미기</button><button data-task="settings">공간 설정·소리</button><button id="environment-open" disabled>조명·배경음</button><button id="study">문샷 공부방</button><button id="private-room">내 사무공간</button><button id="office-link">내 AI 사무실</button><button id="interact">가까운 공간 열기</button></div><p>WASD·방향키로 이동 / 바닥 클릭 / E 상호작용</p></div><button id="map-view" disabled>전체 지도</button><button id="third-view" disabled>3인칭으로 보기</button></div>
<div class="move-pad" aria-label="캐릭터 이동"><button data-direction="up" aria-label="위로 이동">↑</button><div><button data-direction="left" aria-label="왼쪽 이동">←</button><button data-direction="down" aria-label="아래로 이동">↓</button><button data-direction="right" aria-label="오른쪽 이동">→</button></div></div>
</main>
<dialog id="appearance-editor" aria-labelledby="appearance-title">
 <form><header><p>나의 문샷 동료</p><h2 id="appearance-title">캐릭터 꾸미기</h2></header>
 <div class="character-layout"><div class="avatar-preview-card"><div id="avatar-preview"></div><p id="avatar-name"></p><small>공간 속 캐릭터와 같은 모습입니다.</small></div>
 <div class="character-fields"><label>닉네임<input name="nickname" maxlength="24" required autocomplete="off"></label><p class="hint">캐릭터 머리 위에 표시됩니다.</p>
 <div class="profile-fields"><label>캐릭터 유형<select name="gender" aria-label="캐릭터 유형"><option value="male">남성형</option><option value="female">여성형</option></select></label><label>외형 스타일<select name="model" aria-label="외형 스타일"><option value="0">스타일 1</option><option value="1">스타일 2</option><option value="2">스타일 3</option><option value="3">스타일 4</option><option value="4">스타일 5</option><option value="5">스타일 6</option></select></label></div><p class="hint">남성형·여성형, 총 12가지 외형을 고를 수 있어요.</p>
 <div class="character-colors"><label>머리<input type="color" name="hairColor"></label><label>피부<input type="color" name="skinColor"></label><label>의상<input type="color" name="coat"></label><label>바지<input type="color" name="pantsColor"></label></div>
 <label>손에 들 소품<select name="heldItem" aria-label="손에 들 소품"><option value="none">없음</option><option value="coffee">커피 한 잔</option><option value="book">읽고 있는 책</option></select></label>
 </div></div><p id="appearance-error" role="status" aria-live="polite"></p><footer><button id="appearance-cancel" type="button">취소</button><button id="appearance-save" type="button">저장하기</button></footer></form>
</dialog><dialog id="environment-editor" aria-labelledby="environment-title"><header><h2 id="environment-title">조명·배경음</h2><button id="environment-close" aria-label="조명·배경음 닫기">닫기</button></header><p>내 화면과 소리에만 적용됩니다.</p><label class="lighting-field">공간 조명<select id="lighting-select"><option value="bright">밝게</option><option value="normal">보통</option><option value="night">야간</option></select></label><div id="ambient-host"></div></dialog><script type="module" src="./bridge.mjs"></script></body></html>
