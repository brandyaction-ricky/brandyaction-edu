name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

concurrency:
  group: dev-pipeline-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Verify production promotion source
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        shell: bash
        run: |
          if [ "${{ github.head_ref }}" != "develop" ]; then
            echo "Production PRs must promote the develop branch."
            exit 1
          fi
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Content and achievement regression tests
        run: npm test
      - name: Production build
        run: npm run build

  migrate-dev:
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.DEV_SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify DEV-only credentials
        shell: bash
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "DEV_SUPABASE_ACCESS_TOKEN is missing"; exit 1; }
      - name: Apply pending DEV migrations
        run: node scripts/apply-dev-migrations.mjs
