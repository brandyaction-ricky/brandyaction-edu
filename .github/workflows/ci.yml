name: CI
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Linux deletion selection regression only
        run: npx playwright test tests/browser/lesson-editor-input-order.spec.ts --grep "deleting a whole line" --repeat-each=10 --workers=2
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: synthetic-linux-ime-deletion-traces
          path: test-results/
          retention-days: 1
