            expected_files=$(printf '%s\n' app/experience/moonshot/live.ics/route.ts features/campus/arrival/experience.tsx features/campus/arrival/live-reminder-server.ts features/campus/arrival/live-reminder.tsx features/campus/webinar/public-route.ts tests/campus-arrival-access.test.mjs tests/campus-arrival-live-reminder.test.mjs tests/campus-webinar.test.mjs)
