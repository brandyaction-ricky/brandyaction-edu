      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Content and achievement regression tests
        run: npm test
      - name: Production build
        run: npm run build

  browser:
    name: Browser shard ${{ matrix.shard }}/3
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Full browser regression tests
        run: npx playwright test --shard=${{ matrix.shard }}/3
      - name: Save failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failures-${{ matrix.shard }}
          path: test-results/
          retention-days: 3

  payment-widget:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Enabled Toss widget browser regression tests
        env:
          FIXTURE_TOSS_WIDGET_ENABLED: 'true'
          FIXTURE_PORT: '4180'
        run: npx playwright test tests/browser/toss-widget.spec.ts
      - name: Save failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: payment-widget-failures
          path: test-results/
          retention-days: 3

  campus-browser:
    name: Campus browser shard ${{ matrix.shard }}/8
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Campus browser regression tests
        run: npx playwright test --config=playwright.campus.config.ts --shard=${{ matrix.shard }}/8
      - name: Save campus failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: campus-browser-failures-${{ matrix.shard }}
          path: test-results/
          retention-days: 3

  verify:
    if: always()
    needs: [code-checks, browser, payment-widget, campus-browser]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every check to pass
        env:
          CODE_CHECKS: ${{ needs.code-checks.result }}
          BROWSER: ${{ needs.browser.result }}
          PAYMENT_WIDGET: ${{ needs.payment-widget.result }}
          CAMPUS_BROWSER: ${{ needs.campus-browser.result }}
        run: |
          test "$CODE_CHECKS" = success
          test "$BROWSER" = success
          test "$PAYMENT_WIDGET" = success
          test "$CAMPUS_BROWSER" = success

  migrate-dev:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/develop' && inputs.apply_all_pending_dev_migrations
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.DEV_SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify DEV-only credentials
        shell: bash
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "DEV_SUPABASE_ACCESS_TOKEN is missing"; exit 1; }
      - name: Apply pending DEV migrations
        run: node scripts/apply-dev-migrations.mjs
