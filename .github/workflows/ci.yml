name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:
    inputs:
      apply_all_pending_dev_migrations:
        description: Apply all pending SQL migrations to the DEV Supabase project
        required: true
        type: boolean
        default: false

concurrency:
  group: dev-pipeline-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  code-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify production promotion source
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
        shell: bash
        run: |
          head_ref="$HEAD_REF"
          if [ "$head_ref" = "develop" ]; then
            exit 0
          fi

          if [ "$head_ref" = "fix/precision-this-week-layout-20261108" ]; then
            expected_main=d9dba93c905b48a5824ad922f6086cb7a178e0bf
            release_payload=4ac0169920452915792fdc5c3d3a468195ca35f4
            if [ "$(git rev-parse HEAD^1)" != "$expected_main" ]; then
              echo "Production main moved; revalidate the precision report THIS WEEK layout release."
              exit 1
            fi
            if ! git diff --exit-code "$release_payload" HEAD -- . ':(exclude).github/workflows/ci.yml'; then
              echo "The merge result differs from the tested THIS WEEK layout release."
              exit 1
            fi
            echo "Precision report THIS WEEK layout production release scope verified."
            exit 0
          fi

          if [ "$head_ref" = "codex/edu-signup-marketing-copy-20261104" ]; then
            expected_main=bb803efeeedea347e5cf6b283591f4053b5131de
            release_payload=aedfe204dabfcf3b5e54bcf04f6f7b2fa060f6cc
            if [ "$(git rev-parse HEAD^1)" != "$expected_main" ]; then
              echo "Production main moved; revalidate the signup marketing copy release."
              exit 1
            fi
            if ! git diff --exit-code "$release_payload" HEAD -- . ':(exclude).github/workflows/ci.yml'; then
              echo "The merge result differs from the tested signup marketing copy release."
              exit 1
            fi
            echo "Signup marketing copy production release scope verified."
            exit 0
          fi

          if [ "$head_ref" = "codex/edu-buyer-selection-main-release-20261104" ]; then
            expected_main=f06729e9b9f16a3851f5a90b5263d0e8ea1baaed
            release_payload=9f0958a4cea44fd2489df490a5f6b232df959dfe
            if [ "$(git rev-parse HEAD^1)" != "$expected_main" ]; then
              echo "Production main moved; revalidate the scoped buyer selection release."
              exit 1
            fi
            if ! git diff --exit-code "$release_payload" HEAD -- . ':(exclude).github/workflows/ci.yml'; then
              echo "The merge result differs from the tested buyer selection release."
              exit 1
            fi
            echo "Buyer selection production release scope verified."
            exit 0
          fi

          if [ "$head_ref" = "codex/edu-required-consent-main-release-20261104" ]; then
            expected_main=6d534039ce82d988354afc3d5dab377590178dd4
            release_payload=e97479d0aa892f007fef80fa2100760c2bdc5ffc
            if [ "$(git rev-parse HEAD^1)" != "$expected_main" ]; then
              echo "Production main moved; revalidate the scoped consent button release."
              exit 1
            fi
            if ! git diff --exit-code "$release_payload" HEAD -- . ':(exclude).github/workflows/ci.yml'; then
              echo "The merge result differs from the tested consent button release."
              exit 1
            fi
            echo "Consent button production release scope verified."
            exit 0
          fi

          if [ "$head_ref" = "codex/edu-purchase-notice-main-release-20261104" ]; then
            expected_main=924894047d38e26c9e04c15f00da70acf849f8e8
            release_payload=3352b7515fc79b2bc69df0701b4722bbd4fb3e4a
            if [ "$(git rev-parse HEAD^1)" != "$expected_main" ]; then
              echo "Production main moved; revalidate the scoped release."
              exit 1
            fi
            if ! git diff --exit-code "$release_payload" HEAD -- . ':(exclude).github/workflows/ci.yml'; then
              echo "The merge result differs from the scoped purchase notice release."
              exit 1
            fi
            echo "Purchase notice production release scope verified."
            exit 0
          fi

          if [ "$head_ref" = "codex/edu-purchase-delivery-main-release-20261103" ]; then
            # Compare the merge result to the fully tested payload. The live
            # deployment already includes changes absent from GitHub main.
            expected_main=bd6207f45c953fd428dad2b9629fb0aa54ac4d4a
            tested_payload=9d5e93f00c328adc54ea66c40b09a801d0371378
            if [ "$(git rev-parse HEAD^1)" != "$expected_main" ]; then
              echo "Production main moved; revalidate the scoped release."
              exit 1
            fi

            if ! git diff --exit-code "$tested_payload" HEAD -- . ':(exclude).github/workflows/ci.yml'; then
              echo "The merge result differs from the tested purchase delivery payload."
              exit 1
            fi

            echo "Purchase delivery production release scope verified."
            exit 0
          fi

          if [ "$head_ref" = "codex/edu-google-prod-canary-20260930" ]; then
            changed_files="$(git diff --name-only "origin/${BASE_REF}...HEAD")"
            while IFS= read -r path; do
              case "$path" in
                .github/workflows/ci.yml|app/ui/final/public-views.tsx)
                  ;;
                *)
                  echo "File is outside the Google login preview release allowlist: $path"
                  exit 1
                  ;;
              esac
            done <<< "$changed_files"

            for required in .github/workflows/ci.yml app/ui/final/public-views.tsx; do
              if ! grep -Fxq "$required" <<< "$changed_files"; then
                echo "Required Google login preview release file is missing: $required"
                exit 1
              fi
            done

            echo "Google login preview production release scope verified."
            exit 0
          fi

          if [ "$head_ref" = "codex/edu-rich-text-main-release-20260929" ]; then
            changed_files="$(git diff --name-only "origin/${BASE_REF}...HEAD")"
            if [ -z "$changed_files" ]; then
              echo "The EDU rich text release PR has no changed files."
              exit 1
            fi

            while IFS= read -r path; do
              case "$path" in
                .github/workflows/ci.yml|app/ui/final/admin-catalog.tsx|app/ui/final/admin-editors.tsx|app/ui/final/learning-editor.tsx|app/ui/final/lesson-body-editor.css|app/ui/final/lesson-body-editor.tsx|app/ui/final/lesson-rich-input.tsx|app/ui/final/lesson-text.css|app/ui/final/lesson-text.tsx|app/ui/final/product-curriculum-workspace.tsx|lib/lesson-body.ts|package.json|package-lock.json|tests/browser/curriculum-studio.spec.ts|tests/browser/fixture/app.tsx|tests/browser/fixture/lesson-formatting.tsx|tests/browser/lesson-formatting.spec.ts|tests/browser/product-sale.spec.ts|tests/final-uiux.test.mjs)
                  ;;
                *)
                  echo "File is outside the EDU rich text release allowlist: $path"
                  exit 1
                  ;;
              esac
            done <<< "$changed_files"

            for required in app/ui/final/lesson-rich-input.tsx lib/lesson-body.ts tests/browser/lesson-formatting.spec.ts; do
              if ! grep -Fxq "$required" <<< "$changed_files"; then
                echo "Required EDU rich text release file is missing: $required"
                exit 1
              fi
            done

            echo "EDU rich text production release scope verified."
            exit 0
          fi

          if [ "$head_ref" = "codex/edu-menu-main-release" ]; then
            changed_files="$(git diff --name-only "origin/${BASE_REF}...HEAD")"
            if [ -z "$changed_files" ]; then
              echo "The EDU menu release PR has no changed files."
              exit 1
            fi

            while IFS= read -r path; do
              case "$path" in
                .github/workflows/ci.yml|app/api/conversion/route.ts|app/api/platform/route.ts|app/ui/conversion-review.tsx|app/ui/final/admin-shell.tsx|app/ui/marketing-workspace-nav.tsx|app/ui/platform.tsx|tests/browser/fixture/conversion.tsx)
                  ;;
                *)
                  echo "File is outside the EDU menu release allowlist: $path"
                  exit 1
                  ;;
              esac
            done <<< "$changed_files"

            for required in app/api/conversion/route.ts app/api/platform/route.ts app/ui/conversion-review.tsx app/ui/final/admin-shell.tsx app/ui/marketing-workspace-nav.tsx app/ui/platform.tsx tests/browser/fixture/conversion.tsx; do
              if ! grep -Fxq "$required" <<< "$changed_files"; then
                echo "Required EDU menu release file is missing: $required"
                exit 1
              fi
            done

            echo "EDU menu performance release scope verified."
            exit 0
          fi

          if [ "$head_ref" = "codex/edu-menu-admin-data-release" ]; then
            changed_files="$(git diff --name-only "origin/${BASE_REF}...HEAD")"
            if [ -z "$changed_files" ]; then
              echo "The admin data payload release PR has no changed files."
              exit 1
            fi

            while IFS= read -r path; do
              case "$path" in
                .github/workflows/ci.yml|app/api/platform/route.ts|lib/qa-rules.ts|tests/qa-regressions.test.mjs)
                  ;;
                *)
                  echo "File is outside the admin data payload release allowlist: $path"
                  exit 1
                  ;;
              esac
            done <<< "$changed_files"

            for required in app/api/platform/route.ts lib/qa-rules.ts tests/qa-regressions.test.mjs; do
              if ! grep -Fxq "$required" <<< "$changed_files"; then
                echo "Required admin data payload release file is missing: $required"
                exit 1
              fi
            done

            echo "Admin data payload release scope verified."
            exit 0
          fi

          if [ "$head_ref" = "codex/landing-report-main-release" ]; then
            changed_files="$(git diff --name-only "origin/${BASE_REF}...HEAD")"
            if [ -z "$changed_files" ]; then
              echo "The landing report release PR has no changed files."
              exit 1
            fi

            while IFS= read -r path; do
              case "$path" in
                .github/workflows/ci.yml|app/ui/landing/admin.tsx)
                  ;;
                *)
                  echo "File is outside the landing report release allowlist: $path"
                  exit 1
                  ;;
              esac
            done <<< "$changed_files"

            if ! grep -Fxq "app/ui/landing/admin.tsx" <<< "$changed_files"; then
              echo "The landing report release must change app/ui/landing/admin.tsx."
              exit 1
            fi

            echo "Landing report release scope verified."
            exit 0
          fi

          if [ "$head_ref" = "codex/commerce-refund-admin-20260928" ]; then
            changed_files="$(git diff --name-only "origin/${BASE_REF}...HEAD")"
            if [ -z "$changed_files" ]; then
              echo "The Commerce refund admin release PR has no changed files."
              exit 1
            fi

            while IFS= read -r path; do
              case "$path" in
                .github/workflows/ci.yml|app/api/health/route.ts|app/ui/admin-workflows.tsx|docs/ENVIRONMENT_OPERATION_KO.md|lib/refunds.ts|lib/toss-environment.ts|tests/browser/admin-pilot.spec.ts|tests/health.test.mjs|tests/refunds.test.mjs)
                  ;;
                *)
                  echo "File is outside the Commerce refund admin release allowlist: $path"
                  exit 1
                  ;;
              esac
            done <<< "$changed_files"

            for required in app/api/health/route.ts app/ui/admin-workflows.tsx docs/ENVIRONMENT_OPERATION_KO.md lib/refunds.ts lib/toss-environment.ts tests/browser/admin-pilot.spec.ts tests/health.test.mjs tests/refunds.test.mjs; do
              if ! grep -Fxq "$required" <<< "$changed_files"; then
                echo "Required Commerce refund admin release file is missing: $required"
                exit 1
              fi
            done

            echo "Commerce refund admin production release scope verified."
            exit 0
          fi

          if [ "$head_ref" != "codex/commerce-main-release" ]; then
            echo "Production PRs must promote develop or use an approved scoped release branch."
            exit 1
          fi

          changed_files="$(git diff --name-only "origin/${BASE_REF}...HEAD")"
          if [ -z "$changed_files" ]; then
            echo "The Commerce release PR has no changed files."
            exit 1
          fi

          while IFS= read -r path; do
            case "$path" in
              .github/workflows/ci.yml|.env.example|README.md|app/api/payments/toss/webhook/route.ts|package.json|package-lock.json|tests/toss-webhook-idempotency.test.mjs|tests/toss-webhook.test.mjs)
                ;;
              *)
                echo "File is outside the Commerce release allowlist: $path"
                exit 1
                ;;
            esac
          done <<< "$changed_files"

          for required in app/api/payments/toss/webhook/route.ts tests/toss-webhook.test.mjs tests/toss-webhook-idempotency.test.mjs; do
            if ! grep -Fxq "$required" <<< "$changed_files"; then
              echo "Required Commerce release file is missing: $required"
              exit 1
            fi
          done

          echo "Commerce-only production release scope verified."
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Content and achievement regression tests
        run: npm test
      - name: Production build
        run: npm run build

  browser:
    name: Browser shard ${{ matrix.shard }}/3
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Full browser regression tests
        run: npx playwright test --shard=${{ matrix.shard }}/3
      - name: Save failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failures-${{ matrix.shard }}
          path: test-results/
          retention-days: 3

  payment-widget:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Enabled Toss widget browser regression tests
        env:
          FIXTURE_TOSS_WIDGET_ENABLED: 'true'
          FIXTURE_PORT: '4180'
        run: npx playwright test tests/browser/toss-widget.spec.ts
      - name: Save failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: payment-widget-failures
          path: test-results/
          retention-days: 3

  verify:
    if: always()
    needs: [code-checks, browser, payment-widget]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every check to pass
        env:
          CODE_CHECKS: ${{ needs.code-checks.result }}
          BROWSER: ${{ needs.browser.result }}
          PAYMENT_WIDGET: ${{ needs.payment-widget.result }}
        run: |
          test "$CODE_CHECKS" = success
          test "$BROWSER" = success
          test "$PAYMENT_WIDGET" = success

  migrate-dev:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/develop' && inputs.apply_all_pending_dev_migrations
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.DEV_SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify DEV-only credentials
        shell: bash
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "DEV_SUPABASE_ACCESS_TOKEN is missing"; exit 1; }
      - name: Apply pending DEV migrations
        run: node scripts/apply-dev-migrations.mjs
