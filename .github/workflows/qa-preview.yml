name: Full QA (isolated preview)

on:
  workflow_dispatch:
  push:
    branches: [codex/edu-site-stabilization-20261029]

permissions:
  contents: read

concurrency:
  group: full-preview-qa-${{ github.ref }}
  cancel-in-progress: true

# Same checks as CI, in independent runners. No deployment, secrets or DB writes.
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        project: [desktop, tablet, mobile]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Browser regression tests
        env:
          QA_PROJECT: ${{ matrix.project }}
        run: npm run test:browser -- --project="$QA_PROJECT"
      - name: Preserve failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-${{ matrix.project }}
          path: test-results/
          retention-days: 7

  qa-complete:
    if: always()
    needs: [quality, browser]
    runs-on: ubuntu-latest
    steps:
      - name: Require all checks
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
        run: |
          test "$QUALITY_RESULT" = success
          test "$BROWSER_RESULT" = success
